; 容器內的行程管理。以 cmsuser 身分執行（非 root）。
;
;   LogService       收集所有 CMS 服務的日誌（輸出到 docker logs）
;   ResourceService  以 -a 模式啟動並自動重啟其餘服務：
;                    Worker / EvaluationService / ScoringService / Checker /
;                    ContestWebServer / AdminWebServer / ProxyService / PrintingService
;   RankingWebServer 排名網站（CMS_RANKING=true 時啟動）

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700
username=cms
password=cms

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock
username=cms
password=cms

[program:LogService]
command=/opt/cms-venv/bin/cmsLogService 0
priority=10
startsecs=3
autorestart=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ResourceService]
command=/opt/cms-venv/bin/cmsResourceService -a %(ENV_CMS_CONTEST_ID)s 0
priority=20
startsecs=5
autorestart=true
stopsignal=TERM
stopwaitsecs=20
; 連同 ResourceService 啟動的子服務一起停止
stopasgroup=true
killasgroup=true
; 它的訊息 LogService 已經會轉印到 docker logs，這裡只留檔案避免重複
stdout_logfile=/var/local/log/cms/supervisor-ResourceService.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[program:RankingWebServer]
command=/opt/cms-venv/bin/cmsRankingWebServer
priority=30
autostart=%(ENV_CMS_RANKING)s
startsecs=3
autorestart=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
